name: RouterWatch
options:
  bundleIdPrefix: com.mybrightzone
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
    tvOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: B8P24AZNQT
    CODE_SIGN_STYLE: Automatic
    ENABLE_PREVIEWS: YES
    # Single source of truth for the app bundle ID. Every target derives
    # its bundle ID from this variable so the three platform apps ship as
    # one App Store record.
    APP_BUNDLE_ID: com.mybrightzone.routerwatch

targets:
  RouterWatch-iOS:
    type: application
    platform: iOS
    sources:
      - path: RouterWatch
        excludes:
          - "Resources/Info-macOS.plist"
          - "Resources/Info-tvOS.plist"
          - "Resources/RouterWatch-macOS.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        PRODUCT_NAME: RouterWatch
        INFOPLIST_FILE: RouterWatch/Resources/Info-iOS.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  RouterWatch-macOS:
    type: application
    platform: macOS
    sources:
      - path: RouterWatch
        excludes:
          - "Resources/Info-iOS.plist"
          - "Resources/Info-tvOS.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        PRODUCT_NAME: RouterWatch
        INFOPLIST_FILE: RouterWatch/Resources/Info-macOS.plist
        CODE_SIGN_ENTITLEMENTS: RouterWatch/Resources/RouterWatch-macOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES

  RouterWatch-tvOS:
    type: application
    platform: tvOS
    sources:
      - path: RouterWatch
        excludes:
          - "Resources/Info-iOS.plist"
          - "Resources/Info-macOS.plist"
          - "Resources/RouterWatch-macOS.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        PRODUCT_NAME: RouterWatch
        INFOPLIST_FILE: RouterWatch/Resources/Info-tvOS.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        ASSETCATALOG_COMPILER_LAUNCHIMAGE_NAME: "Launch Image"

  RouterWatchTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: RouterWatchTests
    dependencies:
      - target: RouterWatch-macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tests
        PRODUCT_NAME: RouterWatchTests
        GENERATE_INFOPLIST_FILE: YES
        # xcodegen derives TEST_HOST from the target name, but the product is
        # called RouterWatch, not RouterWatch-macOS. Spell it out.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/RouterWatch.app/Contents/MacOS/RouterWatch
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  RouterWatch-iOS:
    build:
      targets:
        RouterWatch-iOS: all
    run:
      config: Debug
  RouterWatch-macOS:
    build:
      targets:
        RouterWatch-macOS: all
        RouterWatchTests: [test]
    test:
      config: Debug
      targets:
        - RouterWatchTests
    run:
      config: Debug
  RouterWatch-tvOS:
    build:
      targets:
        RouterWatch-tvOS: all
    run:
      config: Debug
